name: vimi
description: A dance community for your next eight count.
publish_to: none
version: 1.0.0+1
environment:
  sdk: '>=3.12.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  supabase_flutter: 2.18.3
  flutter_secure_storage: 10.3.1
  shared_preferences: 2.5.5
  image_picker: 1.2.3
  video_player: 2.14.0
  flutter_webrtc: 1.6.3
  path_provider: 2.1.6
  in_app_purchase: 3.3.0
  in_app_purchase_android: 0.5.2
  crypto: 3.0.7
  uuid: 4.6.0
  url_launcher: 6.3.3
dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
flutter:
  uses-material-design: false
  assets:
    - assets/ui/
    - assets/data/
    - assets/legal/
    - assets/fonts/dmsans-OFL.txt
  fonts:
    - family: DMSans
      fonts:
        - asset: assets/fonts/DMSans.ttf
